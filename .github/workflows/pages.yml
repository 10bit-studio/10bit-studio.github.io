name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS video files
        run: |
          git lfs pull
          for f in projects/*.mp4; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 10000 ]; then
              echo "::error::$f is only ${size} bytes — LFS file not smudged"
              exit 1
            fi
            echo "$f OK (${size} bytes)"
          done

      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site/projects
          for item in * .[!.]* ..?*; do
            [ -e "$item" ] || continue
            case "$item" in
              .git|.github|_site|scripts) continue ;;
            esac
            cp -a "$item" _site/
          done
          rm -f _site/projects/*.mp4
          echo "Videos are hosted via GitHub LFS CDN." > _site/projects/README.txt
          du -sh _site

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
