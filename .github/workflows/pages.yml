name: Deploy Pages with LFS videos

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS video files
        run: |
          git lfs pull
          for f in projects/*.mp4; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 10000 ]; then
              echo "::error::$f is only ${size} bytes — LFS file not smudged"
              head -n 2 "$f"
              exit 1
            fi
            echo "$f OK (${size} bytes)"
          done

      - name: Prepare site artifact
        run: |
          set -euo pipefail
          mkdir -p _site/projects
          for item in * .[!.]* ..?*; do
            [ -e "$item" ] || continue
            case "$item" in
              .git|.github|_site|scripts) continue ;;
            esac
            cp -a "$item" _site/
          done
          rm -f _site/projects/*.mp4
          echo "Videos are hosted via GitHub LFS CDN." > _site/projects/README.txt
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
